version: "1.0"

event_taxonomy:
  transaction_events:
    - event_type: TXNX-001
      name: BUY_ORDER_EXECUTED
      description: Buy order has been successfully executed.
      priority: 2
      category: transaction

    - event_type: TXNX-002
      name: SELL_ORDER_EXECUTED
      description: Sell order has been successfully executed.
      priority: 2
      category: transaction

    - event_type: TXNX-003
      name: ORDER_REJECTED
      description: Order has been rejected.
      priority: 1
      category: transaction

    - event_type: TXNX-004
      name: DIVIDEND_CREDITED
      description: Dividend has been credited.
      priority: 2
      category: transaction

    - event_type: TXNX-005
      name: FUNDS_DEPOSITED
      description: Funds have been deposited into the user's account.
      priority: 2
      category: transaction

  risk_margin_events:
    - event_type: RISK-001
      name: MARGIN_CALL_WARNING
      description: User has received a margin call warning.
      priority: 1
      category: risk_margin

    - event_type: RISK-002
      name: MARGIN_SHORTFALL
      description: User has a margin shortfall.
      priority: 1
      category: risk_margin

    - event_type: RISK-003
      name: POSITION_SQUARED_OFF
      description: Positions have been squared off.
      priority: 1
      category: risk_margin

    - event_type: RISK-004
      name: PORTFOLIO_RISK_ALERT
      description: Portfolio risk threshold has been breached.
      priority: 1
      category: risk_margin

    - event_type: RISK-005
      name: CONCENTRATION_ALERT
      description: Portfolio concentration risk has been detected.
      priority: 1
      category: risk_margin

  sip_investment_events:
    - event_type: SIPX-001
      name: SIP_DUE_REMINDER
      description: SIP payment is due.
      priority: 3
      category: sip_investment

    - event_type: SIPX-002
      name: SIP_EXECUTED
      description: SIP transaction has been executed.
      priority: 2
      category: sip_investment

    - event_type: SIPX-003
      name: SIP_FAILED
      description: SIP transaction has failed.
      priority: 1
      category: sip_investment

    - event_type: SIPX-004
      name: SIP_STEP_UP_REMINDER
      description: SIP step-up reminder.
      priority: 3
      category: sip_investment

    - event_type: SIPX-005
      name: GOAL_MILESTONE_REACHED
      description: Investment goal milestone has been reached.
      priority: 3
      category: sip_investment

  market_price_events:
    - event_type: MKTX-001
      name: PRICE_ALERT_TRIGGERED
      description: Monitored asset price has crossed a configured threshold.
      priority: 3
      category: market_price

    - event_type: MKTX-002
      name: CIRCUIT_BREAKER_HIT
      description: Circuit breaker has been triggered for an instrument.
      priority: 1
      category: market_price

    - event_type: MKTX-003
      name: MARKET_OPEN_CLOSE
      description: Market open or close event.
      priority: 4
      category: market_price

    - event_type: MKTX-004
      name: FIFTY_TWO_WEEK_HIGH_LOW
      description: Instrument has reached a 52-week high or low.
      priority: 3
      category: market_price

    - event_type: MKTX-005
      name: EARNINGS_ANNOUNCEMENT
      description: Earnings announcement has been published.
      priority: 3
      category: market_price

  regulatory_compliance_events:
    - event_type: REGX-001
      name: KYC_EXPIRY_WARNING
      description: User KYC is approaching expiry.
      priority: 2
      category: regulatory_compliance

    - event_type: REGX-002
      name: NOMINEE_UPDATE_REMINDER
      description: User needs to update nominee information.
      priority: 2
      category: regulatory_compliance

    - event_type: REGX-003
      name: CONTRACT_NOTE_GENERATED
      description: Contract note has been generated.
      priority: 2
      category: regulatory_compliance

    - event_type: REGX-004
      name: TAX_STATEMENT_AVAILABLE
      description: Tax statement is available.
      priority: 2
      category: regulatory_compliance

    - event_type: REGX-005
      name: REGULATORY_POLICY_CHANGE
      description: Regulatory policy affecting the user has changed.
      priority: 1
      category: regulatory_compliance

priority_levels:
  1:
    name: CRITICAL
    description: Immediate processing required.

  2:
    name: HIGH
    description: High-priority notification.

  3:
    name: NORMAL
    description: Standard notification.

  4:
    name: LOW
    description: Lower-priority notification.

  5:
    name: VERY_LOW
    description: Lowest processing priority.
